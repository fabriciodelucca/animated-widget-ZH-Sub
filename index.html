<!DOCTYPE html>
<html>
<head>
<title>Zenhance Animated Widget</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  body {
    background-color: #140625; /* Added a dark background for demonstration */
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  .promo-widget {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 35px;
    background-color: transparent;
    border-radius: 60px;
    border: none;
    color: white;
    font-family: 'Inter', sans-serif;
    font-size: 22px;
    font-weight: 700;
    white-space: nowrap;
    
    /* This animation name now points to the updated keyframes below */
    animation: pulse 2.5s infinite ease-in-out;
  }
  
  .promo-icon {
    height: 40px;
    width: 40px;
    margin-right: 18px;
    flex-shrink: 0;
  }

  .promo-text-container {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1.3;
  }

  /* --- UPDATED ANIMATION --- */
  @keyframes pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.03);
    }
    100% {
      transform: scale(1);
    }
  }
</style>
</head>
<body>

  <div class="promo-widget">
    <img src="gifticon.png" alt="Promo Icon" class="promo-icon">
    <div class="promo-text-container">
      <div class="promo-text-line">Start Quiz &</div>
      <div class="promo-text-line">Get 75% OFF</div>
    </div>
  </div>

</body>
</html>
